<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafariTracker | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Montserrat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* SafariTracker theme: overrides the template colors and fonts */
      :root {
        --font-body: "Lora", Georgia, serif;
        --font-headline: "Montserrat", Arial, sans-serif;
        --primary-color: #c86d33;
        --secondary-color: #2c4a3e;
        --tertiary-color: #c86d33;
        --sand: #d8c5a5;
        --light-grey: #d8c5a5;
        --dark-grey: #222222;
      }

      h1,
      h2,
      h3,
      button,
      .logo {
        font-family: var(--font-headline);
      }

      .safari-hero {
        background-color: var(--secondary-color);
        color: var(--sand);
        padding: 2.5rem 1.25rem;
        text-align: center;
      }

      .safari-hero h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin-bottom: 0.75rem;
        color: #fff;
      }

      .safari-hero p {
        max-width: 38rem;
        margin: 0 auto;
        line-height: 1.6;
      }

      .safari-hero .highlight {
        color: var(--primary-color);
      }

      .category-card {
        background-color: #fff;
      }

      .category-card span {
        font-family: var(--font-headline);
        color: var(--secondary-color);
      }

      .category-card:hover,
      .category-card:focus-visible {
        border-color: var(--primary-color);
        background-color: var(--sand);
      }
    </style>
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="safari-hero">
        <h1>Plan the drive. Log every sighting.</h1>
        <p>
          Browse African wildlife, build your game-drive schedule, and tick off
          every animal on your life list, all in one place.
        </p>
      </section>

      <section class="product-categories" aria-labelledby="category-title">
        <h2 id="category-title">Explore the Wildlife</h2>
        <div class="category-list">
          <a class="category-card" href="/product_listing/?category=big-five">
            <img src="/images/category-tents.svg" alt="" />
            <span>The Big Five</span>
          </a>
          <a class="category-card" href="/product_listing/?category=predators">
            <img src="/images/category-backpacks.svg" alt="" />
            <span>Predators</span>
          </a>
          <a class="category-card" href="/product_listing/?category=birds">
            <img src="/images/category-sleepingbags.svg" alt="" />
            <span>Birds</span>
          </a>
          <a
            class="category-card"
            href="/product_listing/?category=plains-game"
          >
            <img src="/images/category-hammocks.svg" alt="" />
            <span>Plains Game</span>
          </a>
        </div>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
